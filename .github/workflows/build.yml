# Builds the CloudDown.Editor library, runs the net10.0 test suite, and performs
# SonarCloud static analysis — in a single instrumented build so the solution is
# compiled once. A Windows runner can compile all platform target frameworks
# (Android, iOS, Mac Catalyst, Windows). Producing signed iOS/Mac *app* packages
# would require a macOS runner — a future enhancement, not needed to build the library.
name: Build

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  docs-format:
    # Fast, dependency-light check that Markdown is Prettier-formatted (incl. aligned tables).
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install tooling
      run: npm ci

    - name: Check Markdown formatting
      run: npm run format:check

  build:
    # Single instrumented build: the SonarScanner hooks Roslyn analyzers into the
    # MSBuild compile, so the build must run inside `begin`/`end`. Running the tests
    # (with coverage) in the same job means the solution is built only once, and the
    # coverage report feeds SonarCloud. Needs the .NET SDK + MAUI workloads (the
    # build compiles the platform-TFM control project) and the JDK for the scanner.
    runs-on: windows-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: 17
        distribution: 'zulu'

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 0  # Full history for better relevancy of analysis

    - name: Setup .NET
      uses: actions/setup-dotnet@v5.0.1
      with:
        dotnet-version: 10.0.x

    - name: Restore .NET MAUI workloads
      run: dotnet workload restore

    - name: Cache SonarQube Cloud packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~\sonar\cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarQube Cloud scanner
      id: cache-sonar-scanner
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}\scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install SonarQube Cloud scanner
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
        dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

    - name: Install coverage tool
      shell: powershell
      run: dotnet tool update dotnet-coverage --tool-path ${{ runner.temp }}\coverage

    - name: Build, test and analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      shell: powershell
      run: |
        ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"digitalninjae_clouddown-editor" /o:"digitalninjae" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
        dotnet build --configuration Release
        ${{ runner.temp }}\coverage\dotnet-coverage collect "dotnet test tests/CloudDown.Editor.Tests/CloudDown.Editor.Tests.csproj --no-build --configuration Release --verbosity normal" -f xml -o coverage.xml
        ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
